<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="/css/contacto.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<header class="menu">
    <a href="#" class="menu-logo">
        <img src="/img/limon.png" alt="Logo">
    </a>
    <nav class="menu-items">
        <a href="index.html" class="menu-item">INICIO</a>

        <a href="productos.html" class="menu-item">PRODUCTOS</a>
        <a href="servicios.html" class="menu-item">SERVICIOS</a>

        <a href="contacto.html" class="menu-item"><i class="fas fa-envelope"></i> CONTÁCTANOS</a>
    </nav>
</header>
<body>

    <div class="content-wrapper">
        <!-- Sección de Formulario de Contacto -->
        <section class="formulario-contacto">
            <h2>Contáctanos</h2>            
            <form>
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ingresa tu nombre">
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="Ingresa tu correo electrónico">
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ingresa tu número de teléfono">
                </div>
                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" required placeholder="Escribe tu mensaje"></textarea>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn-submit">Enviar</button>
                </div>
            </form>
        </section>
    </div>

</body>
</html>
